<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINAL FIT — Anime Fashion Battle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>👗</text></svg>" />
  <style>
    :root {
      --purple: #9e40ff;
      --pink: #ff4db8;
      --cyan: #40f2ff;
      --gold: #ffd159;
      --glass: rgba(13, 12, 22, 0.82);
      --glass2: rgba(22, 19, 36, 0.92);
      --text: #f4f2ff;
      --dim: #9a93b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07060c; }
    body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--text); }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }

    .screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    .wordmark {
      font-size: clamp(56px, 10vw, 128px); font-weight: 900; letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--pink), var(--purple) 55%, var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 24px rgba(158, 64, 255, 0.55));
      animation: pulse 3.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { filter: drop-shadow(0 0 42px rgba(255, 77, 184, 0.8)); } }
    .tagline { color: var(--dim); letter-spacing: 0.35em; font-size: 14px; }

    .btn {
      font: inherit; cursor: pointer; border: 1px solid rgba(158, 64, 255, 0.45);
      background: var(--glass2); color: var(--text); padding: 14px 38px;
      font-size: 18px; font-weight: 700; letter-spacing: 0.08em; border-radius: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 22px rgba(158, 64, 255, 0.45);
      background: rgba(40, 30, 64, 0.95);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none; color: #0c0714;
      box-shadow: 0 0 28px rgba(255, 77, 184, 0.45);
    }
    .btn.small { padding: 8px 16px; font-size: 13px; border-radius: 7px; }

    .panel {
      background: var(--glass); border: 1px solid rgba(158, 64, 255, 0.25);
      border-top: 2px solid var(--pink); border-radius: 14px;
      backdrop-filter: blur(14px); padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }
    .panel h3 {
      font-size: 14px; letter-spacing: 0.25em; color: var(--purple);
      margin-bottom: 12px; font-weight: 800;
    }

    /* ---- creator ---- */
    #creator-left { position: absolute; left: 22px; top: 90px; bottom: 110px; width: 300px; overflow-y: auto; }
    #creator-right { position: absolute; right: 22px; top: 90px; bottom: 110px; width: 330px; overflow-y: auto; }
    #creator-title { position: absolute; top: 22px; width: 100%; text-align: center;
      font-size: 30px; font-weight: 900; letter-spacing: 0.3em; }
    #creator-go { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); }
    .preset-btn { display: block; width: 100%; margin-bottom: 8px; text-align: left; }
    .preset-btn.active { border-color: var(--pink); box-shadow: 0 0 16px rgba(255,77,184,0.5); }
    .swatches { display: flex; gap: 8px; margin: 8px 0 14px; }
    .swatch { width: 34px; height: 34px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .swatch.active { border-color: var(--pink); }
    .cycler { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .cycler .val { flex: 1; text-align: center; font-weight: 700; font-size: 14px; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .slider-row label { width: 105px; font-size: 12px; color: var(--dim); }
    .slider-row input { flex: 1; accent-color: var(--pink); }

    /* ---- HUD ---- */
    #hud-banner {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 22px; align-items: center; padding: 10px 26px;
    }
    #hud-banner .theme { color: var(--pink); font-weight: 800; letter-spacing: 0.18em; font-size: 15px; }
    #hud-timer { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
    #hud-timer.warn { color: var(--gold); } #hud-timer.danger { color: #ff5470; animation: pulse 0.8s infinite; }
    #hud-prompt {
      position: absolute; bottom: 13%; width: 100%; text-align: center;
      font-size: 21px; font-weight: 700; text-shadow: 0 0 14px rgba(158,64,255,0.9);
    }
    #hud-hint { position: absolute; bottom: 16px; width: 100%; text-align: center; color: var(--dim); font-size: 13px; letter-spacing: 0.1em; }
    #fit-panel { position: absolute; left: 20px; top: 90px; width: 240px; max-height: 60vh; overflow-y: auto; }
    #fit-panel .slot { font-size: 11px; color: var(--dim); letter-spacing: 0.15em; margin-top: 8px; }
    #fit-panel .item { font-size: 14px; font-weight: 700; }

    /* ---- browse ---- */
    #browse {
      position: absolute; right: 26px; top: 80px; bottom: 80px; width: 460px;
      display: flex; flex-direction: column;
    }
    #browse h2 { font-size: 22px; letter-spacing: 0.2em; margin-bottom: 4px; }
    #browse .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
    #browse-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
    .card {
      display: flex; gap: 12px; align-items: center; padding: 10px 12px;
      background: rgba(28, 24, 46, 0.95); border-radius: 10px;
      border-left: 5px solid var(--rarity, #888); transition: transform 0.1s;
    }
    .card:hover { transform: scale(1.02); }
    .card .sw { width: 44px; height: 44px; border-radius: 8px; flex: none;
      box-shadow: inset 0 -12px 0 var(--c2, #444); background: var(--c1, #888); }
    .card .info { flex: 1; min-width: 0; }
    .card .name { font-weight: 800; font-size: 15px; color: var(--rarity, var(--text)); }
    .card .meta { font-size: 11.5px; color: var(--dim); }

    /* ---- results ---- */
    #results { background: rgba(7, 5, 14, 0.88); }
    #results .score-big {
      font-size: 110px; font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--pink));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #results .rank { font-size: 26px; letter-spacing: 0.4em; color: var(--cyan); font-weight: 800; }
    .cats { display: grid; grid-template-columns: repeat(4, 170px); gap: 10px; margin: 16px 0; }
    .cat { text-align: center; padding: 10px 6px; }
    .cat .v { font-size: 26px; font-weight: 900; color: var(--pink); }
    .cat .k { font-size: 10.5px; letter-spacing: 0.12em; color: var(--dim); }
    .comments { max-width: 720px; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.7; }
    .comments b { color: var(--text); }

    .fade { animation: fadeIn 0.45s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #3a3060; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
